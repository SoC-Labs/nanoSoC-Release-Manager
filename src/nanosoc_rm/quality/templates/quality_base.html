<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · nanoSoC Release Manager</title>
<style>
:root { --bg: #fbfbfa; --fg: #1d1d1b; --muted: #6b6b66; --line: #deddd8; --panel: #fff; --link: #1f4fa3;
        --red: #b3261e; --red-bg: #fbe9e7; --amber: #8a5a00; --amber-bg: #fff4dc; --green: #1e6b34; --green-bg: #e7f4ea; }
@media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --muted: #a3a29c; --line: #34332f;
        --panel: #1f1f1d; --link: #8ab4ff; --red: #ff8a80; --red-bg: #3a1c1a; --amber: #ffcc66; --amber-bg: #3a2f14;
        --green: #8fd6a2; --green-bg: #183121; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
main { padding: 1rem; } a { color: var(--link); }
table { border-collapse: collapse; width: 100%; } th, td { border: 1px solid var(--line); padding: .3rem .5rem; text-align: left; }
.state-red { background: var(--red-bg); color: var(--red); } .state-amber { background: var(--amber-bg); color: var(--amber); }
.state-green { background: var(--green-bg); color: var(--green); } .note { color: var(--muted); }
</style>
</head>
<body><main>
  <p class="age" data-age-seconds="{{ '' if age_seconds is none else age_seconds }}" data-oldest-observed-at="{{ oldest or '' }}">Rendered {{ now }}.</p>
  <h1>{{ title }}</h1>
{{ body }}
</main></body>
</html>
