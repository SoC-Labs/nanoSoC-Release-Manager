# The not-live test suite, the contracts' example check and pyflakes, on every push and pull request.
# Live tests (-m live) need the lab's service config and registry; they never run here.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  not-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Configure git for the hermetic test repos
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Contracts
        run: .venv/bin/python schemas/check_examples.py
      - name: pyflakes
        run: .venv/bin/python -m pyflakes src tests
      - name: Tests (not live)
        run: .venv/bin/python -m pytest -m "not live" -n auto -q tests
