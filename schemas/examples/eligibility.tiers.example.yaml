# CR-12: registry tiers.yaml (eligibility#/$defs/tiers_file). Illustrative paths: a real file names its own
# tool installs and licence servers, and lives only in the private registry.
schema: 1
configurations:
  eth-main:
    t1:
      description: verilator lint of the chiplet RTL (make lint -> verif/lint/run.sh)
      command: make lint
      cwd: .
      env:
        PATH: /opt/tools/verilator/bin:${PATH}
        VERILATOR: /opt/tools/verilator/bin/verilator
      budget_s: 600
      pins: [tidechart, tidelink]
    t2:
      description: VCS smoke of the D2D decode (two self-checking benches)
      command: [make, -C, verif/chiplet_d2d_decode, all]
      cwd: .
      env:
        VCS_HOME: /opt/tools/vcs
        PATH: ${VCS_HOME}/bin:${PATH}
        SNPSLMD_LICENSE_FILE: 27000@licence-server.example
      budget_s: 900
      needs: [vcs-seat, network]
      pins: []
  quickstart-main:
    t1:
      command: ./ci/lint.sh
      cwd: .
      budget_s: 300
      verdicts: build/ci/verdicts.tsv
      regenerates: true
  multicore-master:
    regen:
      description: >-
        Section 20: nanosoc_gen's soc_model render into build_soc. No vendor library is ever named, so the bus
        matrices and the DMA-250 are skipped and recorded under the measurement's coverage.
      command: [make, -C, sys_desc, soc_model]
      cwd: .
      env:
        PYTHON: /usr/bin/python3.8
        BUILD_SOC_DIR: ${TREE}/build_soc
      budget_s: 300
      output: build_soc
      pins: [nanosoc_arch_tech, ethernet-subsystem-ahb, ahb_qspi, inter-processor-communications-ahb]
      exclude: ["reports/*.html"]
