# registry/eligibility.yaml example.
# OBSERVED: eth-rc4's commit and tags (v1.0.0, silicon/eth-chiplet-r0p0 and candidate/rc4-20260829
#   all peel to ab73e40, GET repos/SoC-Labs/NanoSoC-Ethernet-Chiplet/git/tags/<sha>, 2026-09-30).
# JUDGEMENT: which configurations to register, and eth-main's upgrade_from.
schema: 1
configurations:
  - id: eth-rc4                       # the <config> in keep/eth-rc4/* (C10)
    component: nanosoc-ethernet-chiplet
    ref: {tag: v1.0.0}
    commit: "ab73e40924317e45e7b3b941f52a7ed35f20832e"
    frozen: true
    silicon: {chip: eth-chiplet, revision: r0p0}
    errata_prefix: ETH-R0P0           # erratum ids ETH-R0P0-ERR-NNN (README section 3 rule 11)
    # D2, D6 (GATE2 Q1): rc4's known T0 failures. With these 7 its nightly T0 rolls up WAIVED, not FAIL,
    # so a new failure shows red. OBSERVED: the items in result-bundle.items.*.example.jsonl.
    # CR-2 (2026-10-10): the ahb_qspi t0.pins.reachable waiver is retired: e908ac8 is on GitHub since the
    # 2026-10-01 tag keep/eth-rc4/ahb_qspi, so it covered nothing (waiver_unused).
    t0_waivers:
      - {gate: t0.pins.fetchable, tree_path: tidelink, result: fail, approved_by: member-a, approved_on: "2026-10-01",
         reason: "frozen tree pins TideLink by ssh URL; never fetchable anonymously. Covers the 5 pins below it (not-reached)."}
      - {gate: t0.pins.fetchable, tree_path: ASIC/asic-toolkit, result: fail, approved_by: member-a, approved_on: "2026-10-01",
         reason: "frozen tree pins the private ASIC toolkit by ssh URL; never fetchable anonymously"}
      - {gate: t0.urls.no-ssh-public, tree_path: tidelink, result: fail, approved_by: member-a, approved_on: "2026-10-01",
         reason: "frozen tree's .gitmodules uses an ssh URL for TideLink; cannot change without a new commit"}
      - {gate: t0.urls.no-ssh-public, tree_path: ASIC/asic-toolkit, result: fail, approved_by: member-a, approved_on: "2026-10-01",
         reason: "frozen tree's .gitmodules uses an ssh URL for the ASIC toolkit; cannot change without a new commit"}
      - {gate: t0.pins.reachable, tree_path: ASIC/asic-toolkit, result: unverified, approved_by: member-a, approved_on: "2026-10-01",
         reason: "the toolkit's canonical repo is private, so an anonymous job can never judge the pin"}
      - {gate: t0.vendor.no-arm-ip, tree_path: tidelink, result: not-reached, approved_by: member-a, approved_on: "2026-10-01",
         reason: "TideLink and the 5 pins below it are never fetched (ssh URL), so never scanned"}
      - {gate: t0.vendor.no-arm-ip, tree_path: ASIC/asic-toolkit, result: not-reached, approved_by: member-a, approved_on: "2026-10-01",
         reason: "the private toolkit is never fetched (ssh URL), so never scanned"}
  - id: eth-main
    component: nanosoc-ethernet-chiplet
    ref: {branch: main}
    upgrade_from: {tag: v1.0.0}       # D2 upgrade-path clone: rc4 -> main
  - id: multicore-master              # B3 done-when hand-checks rc4 and multicore
    component: nanosoc-multicore-system
    ref: {branch: master}
auto_merge: {}                        # Phase 4 (E2, E3); empty until shadow mode ends
